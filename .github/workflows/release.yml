name: deskconn Release

on:
  workflow_run:
    workflows:
      - deskconn CI
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'

jobs:
  macos:
    name: Build macOS ARM64 archive
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pkg-config
        run: brew install pkgconf
      - name: Build and check macOS release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          ci/prepare-release-sdk.sh "$RUNNER_TEMP/xconn-sdk" darwin_arm64
          XCONN_RELEASE_SDK="$RUNNER_TEMP/xconn-sdk" ci/build-macos-release.sh build/macos-release "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: build/macos-release/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release-main:
    name: Tag and release main build
    needs: macos
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install release toolchains
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 pkg-config

      - name: Download native SDKs
        run: |
          ci/prepare-release-sdk.sh "$RUNNER_TEMP/xconn-sdk"
          echo "XCONN_RELEASE_SDK=$RUNNER_TEMP/xconn-sdk" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: build/macos-release

      - name: Create and push release tag
        if: github.event_name == 'workflow_run'
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG_NAME="v0.1.0-beta.${GIT_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Skipping."
            exit 0
          fi
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
