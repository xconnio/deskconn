name: deskconn Release

on:
  workflow_run:
    workflows:
      - deskconn CI
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'

jobs:
  release-main:
    name: Tag and release main build
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Create and push release tag
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG_NAME="v0.1.0-alpha.${GIT_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Skipping."
            exit 0
          fi
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Install cross-compilation dependencies
        run: |
          sudo dpkg --add-architecture arm64
          # Restrict existing sources to amd64 (Ubuntu 24.04 DEB822 format)
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Architectures:/d' /etc/apt/sources.list.d/ubuntu.sources
            sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          fi
          # Restrict old sources.list format (Ubuntu 22.04)
          if [ -s /etc/apt/sources.list ]; then
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          # Add arm64 packages from ports.ubuntu.com
          CODENAME=$(. /etc/os-release && echo $VERSION_CODENAME)
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main restricted universe multiverse\n' \
            "$CODENAME" "${CODENAME}-updates" "${CODENAME}-security" \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libsystemd-dev libsystemd-dev:arm64

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wick
        run: sudo snap install wick --classic

      - name: Notify deskconn app update
        env:
          WICK_AUTHID: ${{ secrets.WICK_AUTHID }}
          WICK_PRIVATE_KEY: ${{ secrets.WICK_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          DESKCONN_BINARY="$(find dist -type f -path '*/deskconn' | grep '/deskconn_linux_amd64' | head -n 1)"
          if [ -z "${DESKCONN_BINARY}" ]; then
            echo "deskconn release binary not found in dist/"
            exit 1
          fi

          if [ ! -f dist/checksums.txt ]; then
            echo "dist/checksums.txt not found"
            exit 1
          fi

          CHECKSUMS="$(cat dist/checksums.txt)"

          VERSION="$("${DESKCONN_BINARY}" self version | awk '{print $2}')"
          if [ -z "${VERSION}" ]; then
            echo "failed to read deskconn version from ${DESKCONN_BINARY}"
            exit 1
          fi

          wick call io.xconn.deskconn.app.update \
            --url wss://api.deskconn.com/ws \
            --authid "${WICK_AUTHID}" \
            --private-key "${WICK_PRIVATE_KEY}" \
            --realm io.xconn.deskconn \
            deskconn "${VERSION}" "${CHECKSUMS}"
