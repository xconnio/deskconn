version: 2

project_name: deskconn

before:
  hooks:
    - go mod tidy

builds:
  # One multicall binary: the installer links desk, deskconn-userd and deskconn-rootd to it.
  - id: deskconn
    main: ./cmd/deskconn
    binary: deskconn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # No -H=windowsgui here: deskconn is now a multicall binary (see cmd/deskconn), so the
    # same build also runs as the CLI, which needs its console. Hiding deskconn-userd's
    # console on Windows needs a runtime fix (e.g. detaching from the console only when
    # invoked as deskconn-userd/-rootd), not a build-wide linker flag.

archives:
  - id: release-bundle
    ids:
      - deskconn
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

snapshot:
  version_template: "{{ if .Version }}{{ .Version }}-snapshot{{ else }}0.0.0-snapshot{{ end }}"
