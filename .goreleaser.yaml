version: 2

project_name: deskconn

before:
  hooks:
    - go mod tidy
    - sh scripts/fetch-wintun.sh

builds:
  # One binary: the CLI (the installer links desk to it), and with "serve --mode
  # user|standalone|root" the user daemon or the root helper.
  - id: deskconn
    main: ./cmd/deskconn
    binary: deskconn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
  - id: deskconn-windows
    main: ./cmd/deskconn
    binary: deskconn
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    # No -H=windowsgui here: the same build also runs as the CLI, which needs its console.
    # desk serve detaches from the console at runtime instead (see detachConsole).

archives:
  - id: release-bundle
    ids:
      - deskconn
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # Windows also needs the Wintun driver for "deskconn vpn" (see scripts/fetch-wintun.sh).
  - id: release-bundle-windows
    ids:
      - deskconn-windows
    formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README*
      - LICENSE*
      - src: "build/wintun/bin/{{ .Arch }}/wintun.dll"
        dst: wintun.dll
        strip_parent: true
      - src: build/wintun/LICENSE.txt
        dst: wintun-LICENSE.txt
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

snapshot:
  version_template: "{{ if .Version }}{{ .Version }}-snapshot{{ else }}0.0.0-snapshot{{ end }}"
