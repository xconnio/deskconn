version: 2

project_name: deskconn

before:
  hooks:
    - go mod tidy
    - sh scripts/fetch-wintun.sh

builds:
  # One binary: the CLI (the installer links desk to it), and with "serve --mode
  # user|standalone|root" the user daemon or the root helper.
  - id: deskconn
    main: ./cmd/deskconn
    binary: deskconn
    env:
      - CGO_ENABLED=1
      - CC={{ if eq .Arch "arm64" }}aarch64-linux-gnu-gcc{{ else }}gcc{{ end }}
      - PKG_CONFIG_PATH={{ .Env.XCONN_RELEASE_SDK }}/{{ .Os }}_{{ .Arch }}/lib/pkgconfig
    tags:
      - xconn_static
      - netgo
      - osusergo
    ldflags:
      - -s -w -linkmode external -extldflags '-static -Wl,--gc-sections'
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: deskconn-windows
    main: ./cmd/deskconn
    binary: deskconn
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - PKG_CONFIG_PATH={{ .Env.XCONN_RELEASE_SDK }}/windows_amd64/lib/pkgconfig
    tags:
      - xconn_static
      - netgo
      - osusergo
    ldflags:
      - -s -w -linkmode external -extldflags '-static -Wl,--gc-sections'
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # No -H=windowsgui here: the same build also runs as the CLI, which needs its console.
    # desk serve detaches from the console at runtime instead (see detachConsole).

archives:
  - id: release-bundle
    ids:
      - deskconn
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # Windows also needs the Wintun driver for "deskconn vpn" (see scripts/fetch-wintun.sh).
  - id: release-bundle-windows
    ids:
      - deskconn-windows
    formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README*
      - LICENSE*
      - src: "build/wintun/bin/{{ .Arch }}/wintun.dll"
        strip_parent: true
      - src: build/wintun/wintun-LICENSE.txt
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

snapshot:
  version_template: "{{ if .Version }}{{ .Version }}-snapshot{{ else }}0.0.0-snapshot{{ end }}"
